<!-- Reward Button -->
<button class="reward-btn" onclick="showReward()">
    🎁 Get My Monopoly Reward
</button>

<!-- Locker -->
<div id="locker" class="locker-container">
    <div class="locker-box">
        <h3>🎁 Your Reward</h3>
        <p>Complete the required step to continue.</p>

        <div data-captcha-enable="true"></div>
    </div>
</div>

<style>
.reward-btn {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #f2c230, #e39b00);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 0 #9a6500;
    margin-top: 15px;
}

.reward-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #9a6500;
}

.locker-container {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 16px;
    background: #f7f7f7;
    border: 2px solid #e1b62b;
    animation: lockerShow .35s ease;
}

.locker-box {
    text-align: center;
    color: #222;
}

.locker-box h3 {
    margin-bottom: 8px;
}

.locker-box p {
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
}

@keyframes lockerShow {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

<script>
function showReward() {
    const locker = document.getElementById("locker");

    locker.style.display = "block";

    locker.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}
</script>
