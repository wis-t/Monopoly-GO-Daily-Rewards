<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly GO! - اختر مكافأتك</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }

        .header-img {
            width: 100%;
            display: block;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            color: #1a237e;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
        }

        /* أقسام الاختيارات */
        .section {
            background: #f4f8ff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            border: 1px solid #d0e1fd;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #0d47a1;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .option-card {
            background: #fff;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-card.selected {
            border-color: #29b6f6;
            background: #e1f5fe;
            box-shadow: 0 0 8px rgba(41, 182, 246, 0.4);
        }

        .option-card span {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }

        .radio-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #b0bec5;
            margin: 6px auto 0;
            background: #fff;
        }

        .option-card.selected .radio-dot {
            border-color: #0288d1;
            background: #0288d1;
        }

        /* زر الحصول على المكافأة */
        .reward-btn {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #0b6358;
            margin-top: 10px;
            transition: transform 0.1s;
        }

        .reward-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0b6358;
        }

        /* حاوية القفل Locker */
        .locker-container {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border-radius: 16px;
            background: #f7f7f7;
            border: 2px solid #e1b62b;
            animation: lockerShow .35s ease;
        }

        .locker-box {
            text-align: center;
            color: #222;
        }

        .locker-box h3 { margin-bottom: 8px; }
        .locker-box p { font-size: 14px; color: #666; margin-bottom: 15px; }

        @keyframes lockerShow {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/500x200/0288d1/ffffff?text=MONOPOLY+GO!" alt="Monopoly Go Header" class="header-img">

    <div class="content">
        <h2 class="title">اختر مكافأتك</h2>
        <p class="subtitle">حدد العناصر التي ترغب بالحصول عليها للبدء:</p>

        <!-- قسم النرد -->
        <div class="section">
            <div class="section-title">🎲 عدد الرمايات (Dice Rolls)</div>
            <div class="options-grid">
                <div class="option-card selected" onclick="selectOption(this)">
                    <span>25</span>
                    <div class="radio-dot"></div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>100</span>
                    <div class="radio-dot"></div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>500</span>
                    <div class="radio-dot"></div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>1,000</span>
                    <div class="radio-dot"></div>
                </div>
            </div>
        </div>

        <!-- قسم البطاقات -->
        <div class="section">
            <div class="section-title">🃏 حزم الملصقات (Stickers)</div>
            <div class="options-grid">
                <div class="option-card selected" onclick="selectOption(this)">
                    <span>1 Pack</span>
                    <div class="radio-dot"></div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>3 Packs</span>
                    <div class="radio-dot"></div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>5 Packs</span>
                    <div class="radio-dot"></div>
                </div>
                <div class="option-card" onclick="selectOption(this)">
                    <span>10 Packs</span>
                    <div class="radio-dot"></div>
                </div>
            </div>
        </div>

        <!-- زر التأكيد -->
        <button class="reward-btn" onclick="showReward()">
            🎁 GET MY REWARD ➔
        </button>

        <!-- حاوية القفل الخاص بـ OGAds -->
        <div id="locker" class="locker-container">
            <div class="locker-box">
                <div data-captcha-enable="true"></div>
            </div>
        </div>
    </div>
</div>

<script>
function selectOption(element) {
    const parentGrid = element.parentElement;
    const cards = parentGrid.querySelectorAll('.option-card');
    cards.forEach(card => card.classList.remove('selected'));
    element.classList.add('selected');
}

function showReward() {
    const locker = document.getElementById("locker");
    locker.style.display = "block";
    locker.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}
</script>

<!-- سكريبت اللوكر الخاص بك من OGAds -->
<script type="text/javascript" src="https://appsave.store/cp/js/304xn"></script>

</body>
</html>
