<div class="modal" id="verifyModal">

  <div class="verify-card">

    <button class="close" id="closeVerify">×</button>

    <div class="verify-icon">🛡️</div>

    <h2>VERIFY YOU'RE HUMAN</h2>

    <p>
      Please complete the security check to continue.
    </p>

    <!-- REAL CLOUDFLARE TURNSTILE -->
    <div
      class="cf-turnstile"
      data-sitekey="YOUR_TURNSTILE_SITE_KEY"
      data-theme="light"
      data-language="en"
      data-callback="verificationSuccess"
      data-expired-callback="verificationExpired"
      data-error-callback="verificationError">
    </div>

    <div
      id="verifyStatus"
      class="verify-status">
      Verification required
    </div>

    <button
      id="continueReward"
      class="continue-button"
      disabled>
      CONTINUE →
    </button>

    <small class="security-note">
      🔒 Protected by Cloudflare Turnstile
    </small>

  </div>

</div>
